<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wondertech - Panel de Soluciones</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #splash-screen.splash-fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #logo-splash-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 2px solid var(--accent-color);
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #logo-nav-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Categorías / Pestañas superiores */
        .store-categories {
            display: flex;
            gap: 10px;
            padding: 15px 25px;
            overflow-x: auto;
            background: rgba(30, 41, 59, 0.3);
            border-bottom: 1px solid var(--border-color);
        }

        .store-category-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .store-category-item.active {
            background: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        /* Contenedores de pestañas */
        .tab-contents-container {
            display: none;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .tab-contents-container.active {
            display: block;
        }

        /* Tarjetas estilo Glassmorphism */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-content {
            padding: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent-color);
        }

        .user-name {
            font-weight: bold;
            margin: 0;
            font-size: 0.95rem;
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--accent-color);
            margin: 0;
        }

        .card-title {
            font-size: 1.25rem;
            margin: 0 0 10px 0;
        }

        .card-description {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .card-img-container img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .product-price-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .card-tip {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            text-align: right;
        }

        /* Barra de navegación inferior móvil */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .mobile-nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .mobile-nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <!-- Pantalla de Carga -->
    <div id="splash-screen">
        <img id="logo-splash-img" alt="Logo Carga">
        <p>Cargando Wondertech...</p>
    </div>

    <!-- Barra Superior -->
    <nav>
        <div class="nav-brand">
            <img id="logo-nav-img" alt="Logo Nav">
            <span style="font-weight: bold; font-size: 1.1rem;">Wondertech</span>
        </div>
        <div>
            <button onclick="abrirModalLogin()" style="background: var(--accent-color); border:none; padding: 6px 12px; border-radius: 8px; font-weight:bold; cursor:pointer;">Admin</button>
        </div>
    </nav>

    <!-- Pestañas Superiores -->
    <div class="store-categories">
        <button class="store-category-item" id="tab-service-btn" onclick="cambiarPestana('service')">Servicios</button>
        <button class="store-category-item" id="tab-qr-btn" onclick="cambiarPestana('qr')">Placas QR</button>
        <button class="store-category-item" id="tab-noticias-btn" onclick="cambiarPestana('noticias')">Noticias</button>
        <button class="store-category-item active" id="tab-feed-btn" onclick="cambiarPestana('feed')">Todo el Feed</button>
    </div>

    <!-- Contenido de las Pestañas -->
    <div id="contenido-service" class="tab-contents-container">
        <div id="lista-service"></div>
    </div>

    <div id="contenido-qr" class="tab-contents-container">
        <div id="lista-qr"></div>
    </div>

    <div id="contenido-noticias" class="tab-contents-container">
        <div id="lista-noticias"></div>
    </div>

    <div id="contenido-feed" class="tab-contents-container active">
        <div id="lista-feed"></div>
    </div>

    <!-- Barra Inferior Móvil -->
    <div class="mobile-nav">
        <button class="mobile-nav-item" id="m-tab-service-btn" onclick="cambiarPestana('service')">🛠️ Servicios</button>
        <button class="mobile-nav-item" id="m-tab-qr-btn" onclick="cambiarPestana('qr')">🏷️ Placas QR</button>
        <button class="mobile-nav-item" id="m-tab-noticias-btn" onclick="cambiarPestana('noticias')">📰 Noticias</button>
        <button class="mobile-nav-item active" id="m-tab-feed-btn" onclick="cambiarPestana('feed')">🏠 Feed</button>
    </div>

    <!-- Modal Login Simple -->
    <div id="modal-login" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2000; justify-content:center; align-items:center;">
        <div style="background:var(--bg-color); padding:20px; border-radius:12px; border:1px solid var(--border-color); width:300px; margin: 20vh auto;">
            <h3>Acceso Administrativo</h3>
            <p style="font-size:0.85rem; color:#94a3b8;">Función de prueba o login pendiente.</p>
            <button onclick="cerrarModalLogin()" style="background:#ef4444; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer;">Cerrar</button>
        </div>
    </div>

    <!-- Script de conexión directa mediante Fetch (Evita bloqueos de caché y CORS/401 en PC) -->
    <script>
        const SUPABASE_URL = "https://eiespojygliahqtjkkyd.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_TlydS60DSu5pDs6i9LwIPQ_zl00u_mR";

        let usuarioLogueado = null;
        let cacheReportes = [];
        const ordenCategorias = ['service', 'qr', 'noticias', 'feed'];
        let categoriaActualIndex = 3; 

        function ocultarSplashForzado() {
            const splash = document.getElementById('splash-screen');
            if (splash && !splash.classList.contains('splash-fade-out')) {
                splash.classList.add('splash-fade-out');
            }
        }
        setTimeout(ocultarSplashForzado, 1200);

        window.onload = async () => {
            try {
                await cargarLogoPublicoGlobal();
                await cargarContenidoDirecto();
            } catch (e) {
                console.error("Error en la carga inicial:", e);
            } finally {
                ocultarSplashForzado();
            }
        };

        async function cargarLogoPublicoGlobal() {
            const logoUrlFijo = `${SUPABASE_URL}/storage/v1/object/public/fotos-reportes/logo_principal.png?t=${Date.now()}`;
            const splashImg = document.getElementById('logo-splash-img');
            const navImg = document.getElementById('logo-nav-img');
            if (splashImg) splashImg.src = logoUrlFijo;
            if (navImg) navImg.src = logoUrlFijo;
        }

        async function cargarContenidoDirecto() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/reportes?select=*&order=created_at.desc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                cacheReportes = await response.json();

                if (!cacheReportes || cacheReportes.length === 0) {
                    await inyectarDatosPruebaFetch();
                    return;
                }

                renderizarTodo();
            } catch (error) {
                console.error("Error al cargar con fetch directo:", error);
                document.querySelectorAll('.tab-contents-container div[id^="lista-"]').forEach(el => {
                    el.innerHTML = "<p style='text-align:center; color:#fca5a5; padding: 20px;'>Error de conexión con Supabase. Revisa las políticas RLS.</p>";
                });
            }
        }

        async function inyectarDatosPruebaFetch() {
            const datosPrueba = [
                {
                    nombre: "Placa QR Inteligente - Modelo Hueso",
                    categoria: "qr",
                    detalles: "Resistente al agua y golpes. Al escanear el código QR muestra la foto de tu mascota.",
                    contacto: "$10.00",
                    foto: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=800&q=80",
                    autor_nombre: "Wondertech Technologies",
                    autor_avatar: `${SUPABASE_URL}/storage/v1/object/public/fotos-reportes/logo_principal.png`
                },
                {
                    nombre: "Reparación y Mantenimiento de Laptops",
                    categoria: "service",
                    detalles: "Formateo, cambio de pasta térmica, optimización de sistema y reemplazo de pantallas.",
                    contacto: "$35.00",
                    foto: "https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?auto=format&fit=crop&w=800&q=80",
                    autor_nombre: "Wondertech Soporte",
                    autor_avatar: `${SUPABASE_URL}/storage/v1/object/public/fotos-reportes/logo_principal.png`
                }
            ];

            for (let item of datosPrueba) {
                await fetch(`${SUPABASE_URL}/rest/v1/reportes`, {
                    method: 'POST',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify(item)
                });
            }
            cargarContenidoDirecto();
        }

        function renderizarTodo() {
            const renderizarCards = (elementId, listaItems) => {
                const container = document.getElementById(elementId);
                if (!container) return;
                container.innerHTML = listaItems?.length ? "" : "<p style='text-align:center; opacity:0.6; padding: 20px;'>No hay elementos registrados.</p>";

                listaItems?.forEach(item => {
                    const avatar = item.autor_avatar || `${SUPABASE_URL}/storage/v1/object/public/fotos-reportes/logo_principal.png`;
                    const autor = item.autor_nombre || "Wondertech";
                    let imgBlock = item.foto ? `<div class="card-img-container"><img src="${item.foto}" alt="Imagen"></div>` : '';
                    
                    container.innerHTML += `
                        <div class="glass-card">
                            <div class="card-content">
                                <div class="card-header">
                                    <div class="user-info">
                                        <div class="avatar"><img src="${avatar}" alt="Avatar"></div>
                                        <div class="user-details"><p class="user-name">${autor}</p><p class="user-role">${item.categoria?.toUpperCase()}</p></div>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <h3 class="card-title">${item.nombre}</h3>
                                    <p class="card-description">${item.detalles}</p>
                                    ${imgBlock}
                                    <div class="product-price-badge">${item.contacto || 'Consultar'}</div>
                                </div>
                                <p class="card-tip">Wondertech Technologies • Calidad Garantizada</p>
                            </div>
                        </div>`;
                });
            };

            renderizarCards('lista-feed', cacheReportes.filter(r => !['noticias', 'noticia'].includes(r.categoria?.toLowerCase().trim())));
            renderizarCards('lista-service', cacheReportes.filter(r => ['service', 'servicio', 'servicios'].includes(r.categoria?.toLowerCase().trim())));
            renderizarCards('lista-qr', cacheReportes.filter(r => r.categoria?.toLowerCase().trim() === 'qr'));
            renderizarCards('lista-noticias', cacheReportes.filter(r => ['noticias', 'noticia'].includes(r.categoria?.toLowerCase().trim())));
        }

        function cambiarPestana(destino) {
            const nuevoIndex = ordenCategorias.indexOf(destino);
            if (nuevoIndex === -1) return;

            categoriaActualIndex = nuevoIndex;

            document.querySelectorAll('.store-category-item').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${destino}-btn`)?.classList.add('active');

            document.querySelectorAll('.mobile-nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(`m-tab-${destino}-btn`)?.classList.add('active');

            document.querySelectorAll('.tab-contents-container').forEach(c => {
                c.classList.remove('active');
            });

            const contenidoSeleccionado = document.getElementById(`contenido-${destino}`);
            if (contenidoSeleccionado) {
                contenidoSeleccionado.classList.add('active');
            }
        }

        function abrirModalLogin() { document.getElementById('modal-login').style.display = 'flex'; }
        function cerrarModalLogin() { document.getElementById('modal-login').style.display = 'none'; }
    </script>
</body>
</html>
